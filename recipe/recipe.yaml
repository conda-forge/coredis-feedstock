schema_version: 1

context:
  name: coredis
  version: 6.7.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/coredis-${{ version }}.tar.gz
  sha256: 4c18d36c111fcbd95e71aa8ebdcda05b1a0335f51a336fe10fbc1b214015fe4c

build:
  number: 1
  skip: win
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
  host:
    - python
    - mypy
    - packaging
    - hatchling
    - types-deprecated
    - hatch-vcs
    - pip
  run:
    - anyio >=4.11.0
    - exceptiongroup >=1.3.0
    - typing_extensions >=4.13
    - beartype >=0.20
    - python
    - deprecated >=1.2
    - packaging >=21,<27
tests:
  - python:
      imports:
        - coredis
      pip_check: true

about:
  summary: Python async client for Redis key-value store
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/alisaifee/coredis
  repository: https://github.com/alisaifee/coredis

extra:
  recipe-maintainers:
    - jan-janssen
